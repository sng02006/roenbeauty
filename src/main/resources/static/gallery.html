<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>갤러리 | Roen Beauty</title>

<style>
* { margin:0; padding:0; box-sizing:border-box; }
a { text-decoration:none; color:inherit; }

body {
    font-family:"Noto Sans KR", sans-serif;
    background:#f8f6f3;
    color:#333;
}

.container {
    width:min(1100px, 90%);
    margin:auto;
}

/* 헤더 */
header {
    background:rgba(255,255,255,0.8);
    backdrop-filter:blur(6px);
    border-bottom:1px solid #eee;
}

.header-inner {
    display:flex;
    justify-content:space-between;
    align-items:center;
    height:70px;
}

.logo {
    font-size:22px;
    font-weight:600;
    color:#7a6f66;
}

nav ul {
    display:flex;
    gap:25px;
    list-style:none;
}

nav a {
    font-size: 14px;
    color: #666;
    transition: 0.2s;
}

nav a:hover {
    color: #a38b7b;
}

nav a.active {
    color: #a38b7b;
    font-weight: 600;
}

/* 타이틀 */
.page-hero {
    padding:80px 0 40px;
    text-align:center;
}

.page-hero h1 {
    font-size:38px;
}

/* 카테고리 버튼 */
.category-wrap {
    display:flex;
    justify-content:center;
    gap:12px;
    margin-bottom:40px;
    flex-wrap:wrap;
}

.category-btn {
    padding:10px 18px;
    border-radius:30px;
    border:1px solid #d6d0c9;
    background:white;
    color:#7a6f66;
    cursor:pointer;
    transition:0.2s;
}

.category-btn.active {
    background:#a38b7b;
    color:white;
    border:none;
}

.category-btn:hover {
    background:#eee;
}

/* 갤러리 */
.gallery-grid {
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:20px;
}

.gallery-card {
    background:white;
    border-radius:16px;
    overflow:hidden;
    border:1px solid #ece7e1;
    transition:0.2s;
}

.gallery-card:hover {
    transform:translateY(-5px);
}

.gallery-card img {
    width:100%;
    height:260px;
    object-fit:cover;
}

.gallery-info {
    padding:16px;
}

.gallery-info h3 {
    font-size:17px;
    color:#7a6f66;
    margin-bottom:6px;
}

.gallery-info p {
    font-size:14px;
    color:#777;
}

/* 버튼 */
.btn-wrap {
    display:flex;
    justify-content:center;
    gap:12px;
    margin-top:40px;
    margin-bottom:60px;
}

.btn {
    padding:12px 24px;
    border-radius:30px;
    font-weight:600;
}

.btn-main {
    background:#a38b7b;
    color:white;
}

.btn-sub {
    border:1px solid #d6d0c9;
    color:#7a6f66;
}

/* 반응형 */
@media (max-width:900px){
    .gallery-grid { grid-template-columns:1fr 1fr; }
}

@media (max-width:768px){
    .gallery-grid { grid-template-columns:1fr; }
}
</style>
</head>

<body>

<header>
    <div class="container header-inner">
        <div class="logo"><a href="/index.html">Roen Beauty</a></div>
        <nav>
            <ul>
                <li><a href="/index.html">메인</a></li>
                <li><a href="/services.html">시술 메뉴</a></li>
                <li><a href="/gallery.html" class="active">갤러리</a></li>
                <li><a href="/reservation.html">예약하기</a></li>
            </ul>
        </nav>
    </div>
</header>

<div class="page-hero">
    <h1>갤러리</h1>
</div>

<div class="container">

    <!-- 카테고리 -->
    <div class="category-wrap">
        <button class="category-btn active" onclick="filterGallery('all')">전체</button>
        <button class="category-btn" onclick="filterGallery('daily')">데일리</button>
        <button class="category-btn" onclick="filterGallery('art')">아트</button>
        <button class="category-btn" onclick="filterGallery('french')">프렌치</button>
        <button class="category-btn" onclick="filterGallery('parts')">파츠</button>
    </div>

    <!-- 갤러리 -->
    <div class="gallery-grid">

        <div class="gallery-card" data-category="daily">
            <img src="https://images.unsplash.com/photo-1604654894610-df63bc536371">
            <div class="gallery-info">
                <h3>누드 베이지</h3>
                <p>데일리 네일</p>
            </div>
        </div>

        <div class="gallery-card" data-category="art">
            <img src="https://images.unsplash.com/photo-1519014816548-bf5fe059798b">
            <div class="gallery-info">
                <h3>글로시 핑크</h3>
                <p>아트 네일</p>
            </div>
        </div>

        <div class="gallery-card" data-category="french">
            <img src="https://images.unsplash.com/photo-1522337660859-02fbefca4702">
            <div class="gallery-info">
                <h3>프렌치</h3>
                <p>프렌치 네일</p>
            </div>
        </div>

        <div class="gallery-card" data-category="parts">
            <img src="https://images.unsplash.com/photo-1607779097040-26e80aa78e66">
            <div class="gallery-info">
                <h3>파츠 아트</h3>
                <p>파츠 네일</p>
            </div>
        </div>

    </div>

    <div class="btn-wrap">
        <a href="/reservation.html" class="btn btn-main">예약하기</a>
        <a href="/index.html" class="btn btn-sub">메인으로 돌아가기</a>
    </div>

</div>

<script>
function filterGallery(category) {
    const cards = document.querySelectorAll(".gallery-card");
    const buttons = document.querySelectorAll(".category-btn");

    buttons.forEach(btn => btn.classList.remove("active"));
    event.target.classList.add("active");

    cards.forEach(card => {
        if (category === "all" || card.dataset.category === category) {
            card.style.display = "block";
        } else {
            card.style.display = "none";
        }
    });
}
</script>

</body>
</html>
