<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>갤러리 | Roen Beauty</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

a {
    text-decoration: none;
    color: inherit;
}

body {
    font-family: "Noto Sans KR", sans-serif;
    background: #f8f6f3;
    color: #333;
}

.container {
    width: min(1100px, 90%);
    margin: 0 auto;
}

/* 헤더 */
header {
    background: rgba(255, 255, 255, 0.8);
    backdrop-filter: blur(6px);
    border-bottom: 1px solid #eee;
}

.header-inner {
    display: flex;
    justify-content: space-between;
    align-items: center;
    height: 70px;
}

.logo {
    font-size: 22px;
    font-weight: 600;
    color: #7a6f66;
}

nav ul {
    display: flex;
    gap: 25px;
    list-style: none;
}

nav a {
    font-size: 14px;
    color: #666;
    transition: 0.2s;
}

nav a:hover,
nav a.active {
    color: #a38b7b;
    font-weight: 600;
}

/* 페이지 상단 */
.page-hero {
    padding: 80px 0 40px;
    text-align: center;
}

.page-hero h1 {
    font-size: 40px;
    color: #2f2f2f;
    margin-bottom: 14px;
    line-height: 1.3;
}

.page-hero p {
    color: #777;
    line-height: 1.8;
    max-width: 620px;
    margin: 0 auto;
}

/* 카테고리 버튼 */
.category-wrap {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin-bottom: 40px;
    flex-wrap: wrap;
}

.category-btn {
    padding: 10px 18px;
    border-radius: 30px;
    border: 1px solid #d6d0c9;
    background: white;
    color: #7a6f66;
    cursor: pointer;
    transition: 0.2s;
    font-size: 15px;
}

.category-btn.active {
    background: #a38b7b;
    color: white;
    border-color: #a38b7b;
}

.category-btn:hover {
    background: #f3f1ee;
}

/* 상태 메시지 */
.loading-message,
.empty-message,
.error-message {
    text-align: center;
    color: #6f665f;
    font-size: 16px;
    margin-bottom: 30px;
}

/* 갤러리 */
.gallery-section {
    padding-bottom: 80px;
}

.gallery-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 22px;
}

.gallery-card {
    background: white;
    border: 1px solid #ece7e1;
    border-radius: 18px;
    overflow: hidden;
    transition: 0.25s;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
}

.gallery-card:hover {
    transform: translateY(-5px);
}

.gallery-card img {
    width: 100%;
    height: 280px;
    object-fit: cover;
    display: block;
}

.gallery-info {
    padding: 18px 18px 20px;
}

.gallery-info h3 {
    font-size: 18px;
    color: #7a6f66;
    margin-bottom: 8px;
}

.gallery-info p {
    font-size: 14px;
    color: #777;
    line-height: 1.7;
}

/* 버튼 */
.btn-wrap {
    display: flex;
    justify-content: center;
    gap: 12px;
    flex-wrap: wrap;
    margin-top: 50px;
    margin-bottom: 20px;
}

.btn {
    display: inline-block;
    padding: 12px 24px;
    border-radius: 30px;
    font-weight: 600;
    font-size: 15px;
    transition: 0.2s;
}

.btn-main {
    background: #a38b7b;
    color: white;
}

.btn-main:hover {
    background: #8f7868;
}

.btn-sub {
    border: 1px solid #d6d0c9;
    color: #7a6f66;
    background: white;
}

.btn-sub:hover {
    background: #f3f1ee;
}

/* 푸터 */
footer {
    background: #2f2f2f;
    color: #ddd;
    text-align: center;
    padding: 25px;
    font-size: 14px;
}

/* 반응형 */
@media (max-width: 900px) {
    .gallery-grid {
        grid-template-columns: 1fr 1fr;
    }
}

@media (max-width: 768px) {
    .header-inner {
        flex-direction: column;
        justify-content: center;
        gap: 10px;
        height: auto;
        padding: 16px 0;
    }

    nav ul {
        gap: 16px;
        flex-wrap: wrap;
        justify-content: center;
    }

    .page-hero h1 {
        font-size: 32px;
    }

    .gallery-grid {
        grid-template-columns: 1fr;
    }
}

.auth-box {
    display: flex;
    align-items: center;
    gap: 10px;
}

.auth-btn {
    font-size: 13px;
    padding: 6px 12px;
    border-radius: 20px;
    border: 1px solid #d6d0c9;
    background: white;
    color: #7a6f66;
    transition: 0.2s;
}

.auth-btn:hover {
    background: #f3f1ee;
}
</style>
</head>

<body>

<header>
    <div class="container header-inner">
        <div class="logo"><a href="/index.html">Roen Beauty</a></div>
        <nav>
            <ul>
                <li><a href="/index.html">메인</a></li>
                <li><a href="/services.html">시술 메뉴</a></li>
                <li><a href="/gallery.html" class="active">갤러리</a></li>
                <li><a href="/reservation.html">예약하기</a></li>

                <li id="myReservationMenu" style="display:none;">
                    <a href="/my-reservations.html">내 예약</a>
                </li>

                <li id="adminMenu" style="display:none;">
                    <a href="/admin-reservations.html">예약 관리</a>
                </li>

                <li id="adminMenu2" style="display:none;">
                    <a href="/admin-blocked-times.html">시간 차단</a>
                </li>
            </ul>
        </nav>
        <div class="auth-box">
            <a href="/login.html" id="loginBtn" class="auth-btn">로그인</a>
            <a href="/signup.html" id="signupBtn" class="auth-btn">회원가입</a>
            <a href="#" id="logoutBtn" class="auth-btn" style="display:none;">로그아웃</a>
        </div>
    </div>
</header>

<div class="page-hero">
    <div class="container">
        <h1>갤러리</h1>
        <p>
            Roen Beauty의 무드와 스타일을 담은 시술 사진입니다.
            카테고리별로 다양한 이미지를 확인해보세요.
        </p>
    </div>
</div>

<section class="gallery-section">
    <div class="container">

        <div class="category-wrap">
            <button class="category-btn active" data-category="ALL">전체</button>
            <button class="category-btn" data-category="NAIL">네일</button>
            <button class="category-btn" data-category="PEDI">패디</button>
            <button class="category-btn" data-category="EYELASH">속눈썹</button>
            <button class="category-btn" data-category="ETC">기타</button>
        </div>

        <div id="loadingMessage" class="loading-message">갤러리를 불러오는 중입니다...</div>
        <div id="errorMessage" class="error-message" style="display: none;">갤러리를 불러오지 못했습니다.</div>
        <div id="emptyMessage" class="empty-message" style="display: none;">등록된 갤러리가 없습니다.</div>

        <div id="galleryGrid" class="gallery-grid" style="display: none;"></div>

        <div class="btn-wrap">
            <a href="/reservation.html" class="btn btn-main">예약하기</a>
            <a href="/index.html" class="btn btn-sub">메인으로 돌아가기</a>
        </div>
    </div>
</section>

<footer>
    © 2026 Roen Beauty
</footer>

<script>
let allGalleries = [];

document.addEventListener("DOMContentLoaded", function () {
    const user = JSON.parse(localStorage.getItem("user"));

    const loginBtn = document.getElementById("loginBtn");
    const signupBtn = document.getElementById("signupBtn");
    const logoutBtn = document.getElementById("logoutBtn");
    const myReservationMenu = document.getElementById("myReservationMenu");
    const adminMenu = document.getElementById("adminMenu");
    const adminMenu2 = document.getElementById("adminMenu2");

    if (user) {
        loginBtn.style.display = "none";
        signupBtn.style.display = "none";
        logoutBtn.style.display = "inline-block";

        if (myReservationMenu) myReservationMenu.style.display = "block";

        if (user.role === "ADMIN" || user.role === "OWNER") {
            if (adminMenu) adminMenu.style.display = "block";
            if (adminMenu2) adminMenu2.style.display = "block";
        }
    } else {
        loginBtn.style.display = "inline-block";
        signupBtn.style.display = "inline-block";
        logoutBtn.style.display = "none";

        if (myReservationMenu) myReservationMenu.style.display = "none";
    }

    logoutBtn.addEventListener("click", function (e) {
        e.preventDefault();
        localStorage.removeItem("user");
        location.href = "/index.html";
    });

    document.querySelectorAll(".category-btn").forEach(button => {
        button.addEventListener("click", function () {
            document.querySelectorAll(".category-btn").forEach(btn => {
                btn.classList.remove("active");
            });

            this.classList.add("active");
            const category = this.dataset.category;
            filterGalleries(category);
        });
    });

    loadGalleries();
});

async function loadGalleries() {
    const loadingMessage = document.getElementById("loadingMessage");
    const errorMessage = document.getElementById("errorMessage");
    const emptyMessage = document.getElementById("emptyMessage");
    const galleryGrid = document.getElementById("galleryGrid");

    try {
        const response = await fetch("/api/galleries");

        if (!response.ok) {
            throw new Error("갤러리 조회 실패");
        }

        const galleries = await response.json();
        allGalleries = galleries;

        loadingMessage.style.display = "none";

        if (!galleries || galleries.length === 0) {
            emptyMessage.style.display = "block";
            return;
        }

        renderGalleries(galleries);
        galleryGrid.style.display = "grid";
    } catch (error) {
        console.error(error);
        loadingMessage.style.display = "none";
        errorMessage.style.display = "block";
    }
}

function renderGalleries(galleries) {
    const galleryGrid = document.getElementById("galleryGrid");
    const emptyMessage = document.getElementById("emptyMessage");

    galleryGrid.innerHTML = "";

    if (!galleries || galleries.length === 0) {
        galleryGrid.style.display = "none";
        emptyMessage.style.display = "block";
        return;
    }

    emptyMessage.style.display = "none";
    galleryGrid.style.display = "grid";

    galleries.forEach(gallery => {
        const card = document.createElement("div");
        card.className = "gallery-card";

        card.innerHTML = `
            <img src="${gallery.imageUrl}" alt="${gallery.title}">
            <div class="gallery-info">
                <h3>${gallery.title}</h3>
                <p>${gallery.description ?? ""}</p>
            </div>
        `;

        galleryGrid.appendChild(card);
    });
}

function filterGalleries(category) {
    if (category === "ALL") {
        renderGalleries(allGalleries);
        return;
    }

    const filtered = allGalleries.filter(gallery => gallery.category === category);
    renderGalleries(filtered);
}
</script>

</body>
</html>
