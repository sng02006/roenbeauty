<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>영업 시간 관리 | Roen Beauty</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

a {
    text-decoration: none;
    color: inherit;
}

body {
    font-family: "Noto Sans KR", sans-serif;
    background: #f8f6f3;
    color: #333;
}

.container {
    width: min(1100px, 90%);
    margin: 0 auto;
}

header {
    background: rgba(255, 255, 255, 0.8);
    backdrop-filter: blur(6px);
    border-bottom: 1px solid #eee;
}

.header-inner {
    display: flex;
    justify-content: space-between;
    align-items: center;
    height: 70px;
}

.logo {
    font-size: 22px;
    font-weight: 600;
    color: #7a6f66;
}

nav ul {
    display: flex;
    gap: 25px;
    list-style: none;
}

nav a {
    font-size: 14px;
    color: #666;
}

nav a.active,
nav a:hover {
    color: #a38b7b;
    font-weight: 600;
}

.page-hero {
    padding: 70px 0 30px;
    text-align: center;
}

.page-hero h1 {
    font-size: 36px;
    margin-bottom: 12px;
}

.page-hero p {
    color: #777;
    line-height: 1.7;
}

.admin-section {
    padding-bottom: 80px;
}

.card {
    background: #fff;
    border: 1px solid #ece7e1;
    border-radius: 20px;
    padding: 30px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.03);
    margin-bottom: 28px;
}

.form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 18px;
}

.form-group {
    display: flex;
    flex-direction: column;
}

.form-group.full {
    grid-column: 1 / -1;
}

label {
    font-size: 14px;
    font-weight: 600;
    color: #6c635c;
    margin-bottom: 8px;
}

input,
select {
    padding: 13px 15px;
    border: 1px solid #ddd5ce;
    border-radius: 12px;
    font-size: 14px;
    outline: none;
    background: white;
}

input:focus,
select:focus {
    border-color: #a38b7b;
    box-shadow: 0 0 0 3px rgba(163,139,123,0.12);
}

.btn-wrap {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-top: 22px;
}

.btn {
    border: none;
    border-radius: 30px;
    padding: 12px 22px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
}

.btn-main {
    background: #a38b7b;
    color: white;
}

.btn-sub {
    background: white;
    color: #7a6f66;
    border: 1px solid #d6d0c9;
}

.btn-danger {
    background: #fdeaea;
    color: #b04747;
}

.table-scroll {
    overflow-x: auto;
}

table {
    width: 100%;
    min-width: 760px;
    border-collapse: collapse;
}

thead {
    background: #f5f1ec;
}

th, td {
    padding: 15px 14px;
    border-bottom: 1px solid #f0ebe5;
    text-align: left;
    font-size: 14px;
}

th {
    color: #6c635c;
}

.empty-message,
.error-message {
    text-align: center;
    color: #777;
    padding: 24px 0;
}

footer {
    background: #2f2f2f;
    color: #ddd;
    text-align: center;
    padding: 25px;
    font-size: 14px;
}

@media (max-width: 768px) {
    .header-inner {
        flex-direction: column;
        height: auto;
        padding: 16px 0;
        gap: 10px;
    }

    nav ul {
        flex-wrap: wrap;
        justify-content: center;
        gap: 16px;
    }

    .form-grid {
        grid-template-columns: 1fr;
    }

    .page-hero h1 {
        font-size: 30px;
    }
}

.auth-box {
    display: flex;
    align-items: center;
    gap: 10px;
}

.auth-btn {
    font-size: 13px;
    padding: 6px 12px;
    border-radius: 20px;
    border: 1px solid #d6d0c9;
    background: white;
    color: #7a6f66;
    transition: 0.2s;
}

.auth-btn:hover {
    background: #f3f1ee;
}
</style>
</head>

<body>

<header>
    <div class="container header-inner">
        <div class="logo"><a href="/index.html">Roen Beauty</a></div>
        <nav>
            <ul>
                <li><a href="/index.html">메인</a></li>
                <li><a href="/services.html">시술 메뉴</a></li>
                <li><a href="/gallery.html">갤러리</a></li>
                <li><a href="/reservation.html">예약하기</a></li>

                <li class="my-menu" style="display:none;">
                    <a href="/my-reservations.html">내 예약</a>
                </li>

                <li class="admin-menu" style="display:none;">
                    <a href="/admin-reservations.html">예약 관리</a>
                </li>

                <li class="admin-menu" style="display:none;">
                    <a href="/admin-menu-settings.html">메뉴 관리</a>
                </li>

                <li class="admin-menu" style="display:none;">
                    <a href="/admin-gallery.html">갤러리 관리</a>
                </li>

                <li class="admin-menu" style="display:none;">
                    <a href="/admin-blocked-times.html" class="active">영업 시간 관리</a>
                </li>
            </ul>
        </nav>
        <div class="auth-box">
            <a href="/login.html" id="loginBtn" class="auth-btn">로그인</a>
            <a href="#" id="logoutBtn" class="auth-btn" style="display:none;">로그아웃</a>
        </div>
    </div>
</header>

<div class="page-hero">
    <div class="container">
        <h1>영업 시간 관리</h1>
        <p>개인 일정이나 매장 사정으로 예약을 받을 수 없는 시간을 등록할 수 있습니다.</p>
    </div>
</div>

<section class="admin-section">
    <div class="container">

        <div class="card">
            <h3 style="margin-bottom: 20px;">요일별 기본 영업시간 설정</h3>

            <div class="form-grid">
                <div class="form-group">
                    <label for="defaultDayOfWeek">요일</label>
                    <select id="defaultDayOfWeek">
                        <option value="MONDAY">월요일</option>
                        <option value="TUESDAY">화요일</option>
                        <option value="WEDNESDAY">수요일</option>
                        <option value="THURSDAY">목요일</option>
                        <option value="FRIDAY">금요일</option>
                        <option value="SATURDAY">토요일</option>
                        <option value="SUNDAY">일요일</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="defaultOpenTime">오픈 시간</label>
                    <select id="defaultOpenTime"></select>
                </div>

                <div class="form-group">
                    <label for="defaultCloseTime">마감 시간</label>
                    <select id="defaultCloseTime"></select>
                </div>

                <div class="form-group">
                    <label>
                        <input type="checkbox" id="defaultClosed">
                        휴무
                    </label>
                </div>
            </div>

            <div class="btn-wrap">
                <button type="button" class="btn btn-main" onclick="updateDefaultBusinessHour()">기본 영업시간 저장</button>
            </div>

            <div id="defaultBusinessHourList" style="margin-top: 24px; line-height: 1.8; color: #6c635c;"></div>
        </div>

        <div class="card">
            <h3 style="margin-bottom: 20px;">특정 날짜 영업시간 설정</h3>

            <div class="form-grid">
                <div class="form-group">
                    <label for="exceptionDate">날짜</label>
                    <input type="date" id="exceptionDate">
                </div>

                <div class="form-group">
                    <label for="exceptionOpenTime">오픈 시간</label>
                    <select id="exceptionOpenTime"></select>
                </div>

                <div class="form-group">
                    <label for="exceptionCloseTime">마감 시간</label>
                    <select id="exceptionCloseTime"></select>
                </div>

                <div class="form-group">
                    <label>
                        <input type="checkbox" id="exceptionClosed">
                        휴무
                    </label>
                </div>

                <div id="exceptionBusinessHourList" style="margin-top: 24px; line-height: 1.8; color: #6c635c;"></div>
            </div>

            <div class="btn-wrap">
                <button type="button" class="btn btn-main" onclick="saveBusinessHourException()">특정 날짜 영업시간 저장</button>
            </div>
        </div>

        <div class="card">
            <form id="blockedTimeForm">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="blockedDate">차단 날짜</label>
                        <input type="date" id="blockedDate" required>
                    </div>

                    <div class="form-group">
                        <label for="startTime">시작 시간</label>
                        <select id="startTime" required>
                            <option value="">시작 시간을 선택해주세요</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="endTime">종료 시간</label>
                        <select id="endTime" required>
                            <option value="">종료 시간을 선택해주세요</option>
                        </select>
                    </div>

                    <div class="form-group full">
                        <label for="reason">사유</label>
                        <input type="text" id="reason" placeholder="예: 개인 일정, 재료 준비, 휴식 시간">
                    </div>
                </div>

                <div class="btn-wrap">
                    <button type="submit" class="btn btn-main">차단 시간 등록</button>
                </div>
            </form>
        </div>

        <div class="card">
            <div class="table-scroll">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>날짜</th>
                            <th>시작</th>
                            <th>종료</th>
                            <th>사유</th>
                            <th>관리</th>
                        </tr>
                    </thead>
                    <tbody id="blockedTimeTableBody"></tbody>
                </table>
            </div>
            <div id="emptyMessage" class="empty-message" style="display:none;">등록된 차단 시간이 없습니다.</div>
            <div id="errorMessage" class="error-message" style="display:none;">차단 시간을 불러오지 못했습니다.</div>
        </div>

        <div class="btn-wrap">
            <a href="/admin-reservations.html" class="btn btn-main">예약 관리로</a>
            <a href="/index.html" class="btn btn-sub">메인으로 돌아가기</a>
        </div>

    </div>
</section>

<footer>
    © 2026 Roen Beauty
</footer>

<script>
const form = document.getElementById("blockedTimeForm");
const blockedDateInput = document.getElementById("blockedDate");
const startTimeInput = document.getElementById("startTime");
const endTimeInput = document.getElementById("endTime");
const reasonInput = document.getElementById("reason");
const tbody = document.getElementById("blockedTimeTableBody");
const emptyMessage = document.getElementById("emptyMessage");
const errorMessage = document.getElementById("errorMessage");
const defaultBusinessHourList = document.getElementById("defaultBusinessHourList");
const exceptionBusinessHourList = document.getElementById("exceptionBusinessHourList");

const defaultOpenTimeInput = document.getElementById("defaultOpenTime");
const defaultCloseTimeInput = document.getElementById("defaultCloseTime");
const exceptionOpenTimeInput = document.getElementById("exceptionOpenTime");
const exceptionCloseTimeInput = document.getElementById("exceptionCloseTime");

const defaultClosedInput = document.getElementById("defaultClosed");
const exceptionClosedInput = document.getElementById("exceptionClosed");

let businessOpenTime = null;
let businessCloseTime = null;
let isClosed = false;

document.addEventListener("DOMContentLoaded", function () {
    const user = JSON.parse(localStorage.getItem("user"));

    if (!user || (user.role !== "ADMIN" && user.role !== "OWNER")) {
        alert("관리자만 접근할 수 있습니다.");
        location.href = "/index.html";
        return;
    }

    document.getElementById("loginBtn").style.display = "none";
    document.getElementById("logoutBtn").style.display = "inline-block";

    document.querySelectorAll(".my-menu")
        .forEach(menu => menu.style.display = "block");

    document.querySelectorAll(".admin-menu")
        .forEach(menu => menu.style.display = "block");

    document.getElementById("logoutBtn").addEventListener("click", function (e) {
        e.preventDefault();
        localStorage.removeItem("user");
        location.href = "/index.html";
    });

    const today = new Date().toISOString().slice(0, 10);

    blockedDateInput.value = today;
    blockedDateInput.setAttribute("min", today);
    document.getElementById("exceptionDate").setAttribute("min", today);

    loadBusinessHours();
    loadBlockedTimes();
    initBusinessHourTimeSelects();
    loadDefaultBusinessHours();
    loadBusinessHourExceptions();
});

form.addEventListener("submit", async function (event) {
    event.preventDefault();

    if (isClosed) {
        alert("휴무일에는 차단 시간을 등록할 수 없습니다.");
        return;
    }

    if (!startTimeInput.value || !endTimeInput.value) {
        alert("시작 시간과 종료 시간을 선택해주세요.");
        return;
    }

    if (toMinutes(endTimeInput.value) <= toMinutes(startTimeInput.value)) {
        alert("종료 시간은 시작 시간보다 이후여야 합니다.");
        return;
    }

    const requestData = {
        blockedDate: blockedDateInput.value,
        startTime: startTimeInput.value + ":00",
        endTime: endTimeInput.value + ":00",
        reason: reasonInput.value
    };

    try {
        const response = await fetch("/api/blocked-times", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(requestData)
        });

        if (!response.ok) {
            const errorText = await response.text();
            throw new Error(errorText || "차단 시간 등록 실패");
        }

        alert("차단 시간이 등록되었습니다.");

        startTimeInput.value = "";
        endTimeInput.value = "";
        reasonInput.value = "";

        updateTimeOptions();
        await loadBlockedTimes();
    } catch (error) {
        console.error(error);
        alert(error.message || "차단 시간 등록 중 오류가 발생했습니다.");
    }
});

blockedDateInput.addEventListener("change", async function () {
    startTimeInput.value = "";
    endTimeInput.value = "";

    await loadBusinessHours();
    await loadBlockedTimes();
});

startTimeInput.addEventListener("change", updateTimeOptions);
endTimeInput.addEventListener("change", updateTimeOptions);

defaultOpenTimeInput.addEventListener("change", updateDefaultBusinessHourTimeOptions);
defaultCloseTimeInput.addEventListener("change", updateDefaultBusinessHourTimeOptions);
exceptionOpenTimeInput.addEventListener("change", updateExceptionBusinessHourTimeOptions);
exceptionCloseTimeInput.addEventListener("change", updateExceptionBusinessHourTimeOptions);

defaultClosedInput.addEventListener("change", function () {
    toggleBusinessHourInputs(
        defaultClosedInput,
        defaultOpenTimeInput,
        defaultCloseTimeInput,
        updateDefaultBusinessHourTimeOptions
    );
});

exceptionClosedInput.addEventListener("change", function () {
    toggleBusinessHourInputs(
        exceptionClosedInput,
        exceptionOpenTimeInput,
        exceptionCloseTimeInput,
        updateExceptionBusinessHourTimeOptions
    );
});

async function loadBusinessHours() {
    const date = blockedDateInput.value;

    try {
        const response = await fetch(`/api/business-hours?date=${date}`);

        if (!response.ok) {
            throw new Error("영업시간 조회 실패");
        }

        const data = await response.json();

        isClosed = data.closed;

        if (isClosed) {
            businessOpenTime = null;
            businessCloseTime = null;

            renderTimeOptions(startTimeInput, [], "휴무일");
            renderTimeOptions(endTimeInput, [], "휴무일");
            return;
        }

        businessOpenTime = data.openTime.substring(0, 5);
        businessCloseTime = data.closeTime.substring(0, 5);

        updateTimeOptions();
    } catch (error) {
        console.error(error);
        alert("영업시간을 불러오지 못했습니다.");
    }
}

function updateTimeOptions() {
    if (!businessOpenTime || !businessCloseTime) {
        renderTimeOptions(startTimeInput, [], "선택 불가");
        renderTimeOptions(endTimeInput, [], "선택 불가");
        return;
    }

    const selectedStartTime = startTimeInput.value;
    const selectedEndTime = endTimeInput.value;

    const allTimes = createTimeOptions(businessOpenTime, businessCloseTime, 30);

    const startTimes = selectedEndTime
        ? allTimes.filter(time => toMinutes(time) < toMinutes(selectedEndTime))
        : allTimes;

    const endTimes = selectedStartTime
        ? allTimes.filter(time => toMinutes(time) > toMinutes(selectedStartTime))
        : allTimes;

    renderTimeOptions(startTimeInput, startTimes, "시작 시간을 선택해주세요", selectedStartTime);
    renderTimeOptions(endTimeInput, endTimes, "종료 시간을 선택해주세요", selectedEndTime);
}

function initBusinessHourTimeSelects() {
    updateDefaultBusinessHourTimeOptions();
    updateExceptionBusinessHourTimeOptions();

    toggleBusinessHourInputs(
        defaultClosedInput,
        defaultOpenTimeInput,
        defaultCloseTimeInput,
        updateDefaultBusinessHourTimeOptions
    );

    toggleBusinessHourInputs(
        exceptionClosedInput,
        exceptionOpenTimeInput,
        exceptionCloseTimeInput,
        updateExceptionBusinessHourTimeOptions
    );
}

function updateDefaultBusinessHourTimeOptions() {
    updateBusinessHourRangeOptions(
        defaultOpenTimeInput,
        defaultCloseTimeInput,
        "오픈 시간 선택",
        "마감 시간 선택"
    );
}

function updateExceptionBusinessHourTimeOptions() {
    updateBusinessHourRangeOptions(
        exceptionOpenTimeInput,
        exceptionCloseTimeInput,
        "오픈 시간 선택",
        "마감 시간 선택"
    );
}

function updateBusinessHourRangeOptions(openSelect, closeSelect, openPlaceholder, closePlaceholder) {
    const selectedOpenTime = openSelect.value;
    const selectedCloseTime = closeSelect.value;

    const allTimes = createTimeOptions("00:00", "23:30", 30);

    const openTimes = selectedCloseTime
        ? allTimes.filter(time => toMinutes(time) < toMinutes(selectedCloseTime))
        : allTimes;

    const closeTimes = selectedOpenTime
        ? allTimes.filter(time => toMinutes(time) > toMinutes(selectedOpenTime))
        : allTimes;

    const nextOpenValue = openTimes.includes(selectedOpenTime) ? selectedOpenTime : "";
    const nextCloseValue = closeTimes.includes(selectedCloseTime) ? selectedCloseTime : "";

    renderTimeOptions(openSelect, openTimes, openPlaceholder, nextOpenValue);
    renderTimeOptions(closeSelect, closeTimes, closePlaceholder, nextCloseValue);
}

function toggleBusinessHourInputs(closedInput, openSelect, closeSelect, updateFunction) {
    if (closedInput.checked) {
        openSelect.value = "";
        closeSelect.value = "";
        openSelect.disabled = true;
        closeSelect.disabled = true;
        return;
    }

    openSelect.disabled = false;
    closeSelect.disabled = false;
    updateFunction();
}

function renderTimeOptions(selectElement, times, placeholder, selectedValue = "") {
    selectElement.innerHTML = `<option value="">${placeholder}</option>`;

    times.forEach(time => {
        const option = document.createElement("option");
        option.value = time;
        option.textContent = time;

        if (time === selectedValue) {
            option.selected = true;
        }

        selectElement.appendChild(option);
    });
}

function createTimeOptions(startTime, endTime, intervalMinutes) {
    const times = [];

    let current = toMinutes(startTime);
    const end = toMinutes(endTime);

    while (current <= end) {
        times.push(toTimeText(current));
        current += intervalMinutes;
    }

    return times;
}

function toMinutes(timeText) {
    const [hour, minute] = timeText.split(":").map(Number);
    return hour * 60 + minute;
}

function toTimeText(totalMinutes) {
    const hour = String(Math.floor(totalMinutes / 60)).padStart(2, "0");
    const minute = String(totalMinutes % 60).padStart(2, "0");
    return `${hour}:${minute}`;
}

async function loadBlockedTimes() {
    const blockedDate = blockedDateInput.value;

    if (!blockedDate) {
        alert("차단 날짜를 선택해주세요.");
        return;
    }

    tbody.innerHTML = "";
    emptyMessage.style.display = "none";
    errorMessage.style.display = "none";

    try {
        const response = await fetch(`/api/blocked-times?blockedDate=${blockedDate}`);

        if (!response.ok) {
            throw new Error("차단 시간 조회 실패");
        }

        const blockedTimes = await response.json();

        if (!blockedTimes || blockedTimes.length === 0) {
            emptyMessage.style.display = "block";
            return;
        }

        blockedTimes.forEach(blockedTime => {
            const tr = document.createElement("tr");

            tr.innerHTML = `
                <td>${blockedTime.id}</td>
                <td>${blockedTime.blockedDate}</td>
                <td>${formatTime(blockedTime.startTime)}</td>
                <td>${formatTime(blockedTime.endTime)}</td>
                <td>${blockedTime.reason || "-"}</td>
                <td>
                    <button class="btn btn-danger" onclick="deleteBlockedTime(${blockedTime.id})">삭제</button>
                </td>
            `;

            tbody.appendChild(tr);
        });
    } catch (error) {
        console.error(error);
        errorMessage.style.display = "block";
    }
}

async function deleteBlockedTime(id) {
    if (!confirm("해당 차단 시간을 삭제하시겠습니까?")) {
        return;
    }

    try {
        const response = await fetch(`/api/blocked-times/${id}`, {
            method: "DELETE"
        });

        if (!response.ok) {
            const errorText = await response.text();
            throw new Error(errorText || "차단 시간 삭제 실패");
        }

        alert("차단 시간이 삭제되었습니다.");
        await loadBlockedTimes();
    } catch (error) {
        console.error(error);
        alert(error.message || "차단 시간 삭제 중 오류가 발생했습니다.");
    }
}

function formatTime(time) {
    if (!time) {
        return "-";
    }

    return time.substring(0, 5);
}

async function updateDefaultBusinessHour() {
    const closed = defaultClosedInput.checked;
    const openTime = defaultOpenTimeInput.value;
    const closeTime = defaultCloseTimeInput.value;

    if (!closed && (!openTime || !closeTime)) {
        alert("휴무가 아닌 경우 오픈 시간과 마감 시간을 입력해주세요.");
        return;
    }

    if (!closed && toMinutes(closeTime) <= toMinutes(openTime)) {
        alert("마감 시간은 오픈 시간보다 이후여야 합니다.");
        return;
    }

    const requestData = {
        dayOfWeek: document.getElementById("defaultDayOfWeek").value,
        openTime: closed ? null : openTime + ":00",
        closeTime: closed ? null : closeTime + ":00",
        closed: closed
    };

    try {
        const response = await fetch("/api/business-hours/default", {
            method: "PUT",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(requestData)
        });

        if (!response.ok) {
            throw new Error("기본 영업시간 저장 실패");
        }

        alert("기본 영업시간이 저장되었습니다.");

        await loadDefaultBusinessHours();
        await loadBusinessHours();
    } catch (error) {
        console.error(error);
        alert("기본 영업시간 저장 중 오류가 발생했습니다.");
    }
}

async function saveBusinessHourException() {
    const exceptionDate = document.getElementById("exceptionDate").value;
    const closed = exceptionClosedInput.checked;
    const openTime = exceptionOpenTimeInput.value;
    const closeTime = exceptionCloseTimeInput.value;

    if (!exceptionDate) {
        alert("날짜를 선택해주세요.");
        return;
    }

    if (!closed && (!openTime || !closeTime)) {
        alert("휴무가 아닌 경우 오픈 시간과 마감 시간을 입력해주세요.");
        return;
    }

    if (!closed && toMinutes(closeTime) <= toMinutes(openTime)) {
        alert("마감 시간은 오픈 시간보다 이후여야 합니다.");
        return;
    }

    const requestData = {
        date: exceptionDate,
        openTime: closed ? null : openTime + ":00",
        closeTime: closed ? null : closeTime + ":00",
        closed: closed
    };

    try {
        const response = await fetch("/api/business-hours/exceptions", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(requestData)
        });

        if (!response.ok) {
            throw new Error("특정 날짜 영업시간 저장 실패");
        }

        alert("특정 날짜 영업시간이 저장되었습니다.");

        blockedDateInput.value = exceptionDate;

        await loadBusinessHourExceptions();
        await loadBusinessHours();
        await loadBlockedTimes();
    } catch (error) {
        console.error(error);
        alert("특정 날짜 영업시간 저장 중 오류가 발생했습니다.");
    }
}

async function loadDefaultBusinessHours() {
    try {
        const response = await fetch("/api/business-hours/default");

        if (!response.ok) {
            throw new Error("기본 영업시간 조회 실패");
        }

        const businessHours = await response.json();

        defaultBusinessHourList.innerHTML = businessHours.map(hour => {
            const dayText = convertDayOfWeek(hour.dayOfWeek);

            if (hour.closed) {
                return `<div>${dayText}: 휴무</div>`;
            }

            return `<div>${dayText}: ${formatTime(hour.openTime)} ~ ${formatTime(hour.closeTime)}</div>`;
        }).join("");
    } catch (error) {
        console.error(error);
        defaultBusinessHourList.innerHTML = "기본 영업시간을 불러오지 못했습니다.";
    }
}

async function loadBusinessHourExceptions() {
    try {
        const response = await fetch("/api/business-hours/exceptions");

        if (!response.ok) {
            throw new Error("특정 날짜 영업시간 조회 실패");
        }

        const exceptions = await response.json();

        if (!exceptions || exceptions.length === 0) {
            exceptionBusinessHourList.innerHTML = "등록된 특정 날짜 영업시간이 없습니다.";
            return;
        }

        exceptionBusinessHourList.innerHTML = exceptions.map(exception => {
            if (exception.closed) {
                return `<div>${exception.date}: 휴무</div>`;
            }

            return `<div>${exception.date}: ${formatTime(exception.openTime)} ~ ${formatTime(exception.closeTime)}</div>`;
        }).join("");
    } catch (error) {
        console.error(error);
        exceptionBusinessHourList.innerHTML = "특정 날짜 영업시간을 불러오지 못했습니다.";
    }
}

function convertDayOfWeek(dayOfWeek) {
    const days = {
        MONDAY: "월요일",
        TUESDAY: "화요일",
        WEDNESDAY: "수요일",
        THURSDAY: "목요일",
        FRIDAY: "금요일",
        SATURDAY: "토요일",
        SUNDAY: "일요일"
    };

    return days[dayOfWeek] || dayOfWeek;
}
