<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>예약하기 | Roen Beauty</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

a {
    text-decoration: none;
    color: inherit;
}

body {
    font-family: "Noto Sans KR", sans-serif;
    background: #f8f6f3;
    color: #333;
}

.container {
    width: min(1100px, 90%);
    margin: 0 auto;
}

/* 헤더 */
header {
    background: rgba(255, 255, 255, 0.8);
    backdrop-filter: blur(6px);
    border-bottom: 1px solid #eee;
}

.header-inner {
    display: flex;
    justify-content: space-between;
    align-items: center;
    height: 70px;
}

.logo {
    font-size: 22px;
    font-weight: 600;
    color: #7a6f66;
}

nav ul {
    display: flex;
    gap: 25px;
    list-style: none;
}

nav a {
    font-size: 14px;
    color: #666;
    transition: 0.2s;
}

nav a:hover {
    color: #a38b7b;
}

nav a.active {
    color: #a38b7b;
    font-weight: 600;
}

/* 페이지 상단 */
.page-hero {
    padding: 80px 0 40px;
    text-align: center;
}

.page-hero h1 {
    font-size: 40px;
    color: #2f2f2f;
    margin-bottom: 14px;
    line-height: 1.3;
}

.page-hero p {
    color: #777;
    line-height: 1.8;
    max-width: 620px;
    margin: 0 auto;
}

/* 예약 폼 */
.form-section {
    padding-bottom: 80px;
}

.form-card {
    background: white;
    border: 1px solid #ece7e1;
    border-radius: 20px;
    padding: 36px;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
}

.form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 22px 20px;
}

.form-group {
    display: flex;
    flex-direction: column;
}

.form-group.full {
    grid-column: 1 / -1;
}

label {
    font-size: 14px;
    font-weight: 600;
    color: #6c635c;
    margin-bottom: 8px;
}

input,
select,
textarea {
    width: 100%;
    padding: 14px 16px;
    border: 1px solid #ddd5ce;
    border-radius: 12px;
    background: #fff;
    font-size: 14px;
    color: #333;
    outline: none;
    transition: 0.2s;
}

input:focus,
select:focus,
textarea:focus {
    border-color: #a38b7b;
    box-shadow: 0 0 0 3px rgba(163, 139, 123, 0.12);
}

textarea {
    resize: vertical;
    min-height: 130px;
    line-height: 1.7;
}

.notice-box {
    margin-top: 26px;
    padding: 20px;
    border-radius: 16px;
    background: #f5f1ec;
    color: #6f665f;
    font-size: 14px;
    line-height: 1.8;
}

.notice-box strong {
    color: #7a6f66;
}

/* 버튼 */
.btn-wrap {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    margin-top: 28px;
}

.btn {
    display: inline-block;
    padding: 12px 24px;
    border-radius: 30px;
    font-weight: 600;
    font-size: 16px;
    transition: 0.2s;
    border: none;
    cursor: pointer;
}

.btn-main {
    background: #a38b7b;
    color: white;
}

.btn-main:hover {
    background: #8f7868;
}

.btn-sub {
    border: 1px solid #d6d0c9;
    color: #7a6f66;
    background: white;
}

.btn-sub:hover {
    background: #f3f1ee;
}

/* 푸터 */
footer {
    background: #2f2f2f;
    color: #ddd;
    text-align: center;
    padding: 25px;
    font-size: 14px;
}

/* 반응형 */
@media (max-width: 768px) {
    .header-inner {
        flex-direction: column;
        justify-content: center;
        gap: 10px;
        height: auto;
        padding: 16px 0;
    }

    nav ul {
        gap: 16px;
        flex-wrap: wrap;
        justify-content: center;
    }

    .page-hero h1 {
        font-size: 32px;
    }

    .form-grid {
        grid-template-columns: 1fr;
    }

    .form-card {
        padding: 24px;
    }
}
</style>
</head>

<body>

<header>
    <div class="container header-inner">
        <div class="logo"><a href="/index.html">Roen Beauty</a></div>
        <nav>
            <ul>
                <li><a href="/index.html">메인</a></li>
                <li><a href="/services.html">시술 메뉴</a></li>
                <li><a href="/gallery.html">갤러리</a></li>
                <li><a href="/reservation.html" class="active">예약하기</a></li>
            </ul>
        </nav>
    </div>
</header>

<div class="page-hero">
    <div class="container">
        <h1>예약하기</h1>
        <p>
            원하시는 날짜와 시술 정보를 남겨주시면
            확인 후 순차적으로 안내드리겠습니다.
        </p>
    </div>
</div>

<section class="form-section">
    <div class="container">
        <div class="form-card">
            <form id="reservationForm">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="name">이름</label>
                        <input type="text" id="name" name="name" placeholder="이름을 입력해주세요" required>
                    </div>

                    <div class="form-group">
                        <label for="phone">연락처</label>
                        <input type="tel" id="phone" name="phone" placeholder="010-0000-0000" required>
                    </div>

                    <div class="form-group">
                        <label for="date">예약 날짜</label>
                        <input type="date" id="date" name="date" required>
                    </div>

                    <div class="form-group">
                        <label for="time">예약 시간</label>
                        <select id="time" name="time" required>
                            <option value="">시간을 선택해주세요</option>
                            <option>10:00</option>
                            <option>11:00</option>
                            <option>12:00</option>
                            <option>13:00</option>
                            <option>14:00</option>
                            <option>15:00</option>
                            <option>16:00</option>
                            <option>17:00</option>
                            <option>18:00</option>
                        </select>
                    </div>

                    <div class="form-group full">
                        <label for="service">시술 메뉴</label>
                        <select id="service" name="service" required>
                            <option value="">시술 메뉴를 선택해주세요</option>
                            <option>기본 젤 네일</option>
                            <option>손 케어</option>
                            <option>제거 + 케어</option>
                            <option>이달의 아트</option>
                            <option>프리미엄 아트</option>
                            <option>맞춤 디자인</option>
                        </select>
                    </div>

                    <div class="form-group full">
                        <label for="request">요청사항</label>
                        <textarea id="request" name="request" placeholder="원하시는 디자인, 참고 이미지 유무, 문의사항 등을 자유롭게 남겨주세요"></textarea>
                    </div>
                </div>

                <div class="notice-box">
                    <strong>예약 안내</strong><br>
                    - 예약 요청 후 상담을 통해 최종 예약이 확정됩니다.<br>
                    - 시술 내용 및 디자인에 따라 소요 시간과 금액이 달라질 수 있습니다.<br>
                    - 일정 변경이나 취소는 가능한 한 미리 연락 부탁드립니다.
                </div>

                <div class="btn-wrap">
                    <button type="submit" class="btn btn-main">예약 요청 보내기</button>
                    <a href="/index.html" class="btn btn-sub">메인으로 돌아가기</a>
                </div>
            </form>
        </div>
    </div>
</section>

<footer>
    © 2026 Roen Beauty
</footer>

<script>
document.getElementById("reservationForm").addEventListener("submit", async function(event) {
    event.preventDefault();

    const reservationData = {
        name: document.getElementById("name").value,
        phone: document.getElementById("phone").value,
        reservationDate: document.getElementById("date").value,
        reservationTime: document.getElementById("time").value + ":00",
        serviceName: document.getElementById("service").value,
        requestMemo: document.getElementById("request").value
    };

    try {
        const response = await fetch("/api/reservations", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(reservationData)
        });

        if (!response.ok) {
            const errorText = await response.text();
            throw new Error(errorText || "예약 요청에 실패했습니다.");
        }

        const result = await response.json();

        alert(
            `${result.name}님의 예약 요청이 접수되었습니다.\n\n` +
            `예약 날짜: ${result.reservationDate}\n` +
            `예약 시간: ${result.reservationTime}\n` +
            `시술 메뉴: ${result.serviceName}\n` +
            `상태: ${result.status}\n\n` +
            `확인 후 순차적으로 안내드리겠습니다.`
        );

        this.reset();
    } catch (error) {
        console.error(error);

        if (error.message.includes("이미 예약된 시간입니다")) {
            alert("이미 예약된 시간입니다. 다른 시간을 선택해주세요.");
            return;
        }

        alert("예약 저장 중 오류가 발생했습니다.");
    }
});
</script>

</body>
</html>
