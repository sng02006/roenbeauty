<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>내 예약 | Ro:en Beauty</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

a {
    text-decoration: none;
    color: inherit;
}

body {
    font-family: "Noto Sans KR", sans-serif;
    background: #f8f6f3;
    color: #333;
}

.container {
    width: min(1100px, 90%);
    margin: 0 auto;
}

header {
    background: rgba(255, 255, 255, 0.8);
    backdrop-filter: blur(6px);
    border-bottom: 1px solid #eee;
}

.header-inner {
    display: flex;
    justify-content: space-between;
    align-items: center;
    height: 70px;
}

.logo {
    font-size: 22px;
    font-weight: 600;
    color: #7a6f66;
}

nav ul {
    display: flex;
    gap: 25px;
    list-style: none;
}

nav a {
    font-size: 14px;
    color: #666;
    transition: 0.2s;
}

nav a:hover,
nav a.active {
    color: #a38b7b;
    font-weight: 600;
}

.auth-box {
    display: flex;
    align-items: center;
    gap: 10px;
}

.auth-btn {
    font-size: 13px;
    padding: 6px 12px;
    border-radius: 20px;
    border: 1px solid #d6d0c9;
    background: white;
    color: #7a6f66;
    transition: 0.2s;
}

.auth-btn:hover {
    background: #f3f1ee;
}

.page-hero {
    padding: 48px 0 28px;
    text-align: center;
}

.page-hero h1 {
    font-size: 40px;
    color: #2f2f2f;
    margin-bottom: 14px;
    line-height: 1.3;
}

.page-hero p {
    color: #777;
    line-height: 1.8;
}

.reservation-section {
    padding-bottom: 80px;
}

.empty-box {
    background: white;
    border: 1px solid #ece7e1;
    border-radius: 20px;
    padding: 50px;
    text-align: center;
    color: #777;
}

.reservation-list {
    display: grid;
    gap: 18px;
}

.reservation-card {
    background: white;
    border: 1px solid #ece7e1;
    border-radius: 20px;
    padding: 22px 24px;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
}

.card-header {
    display: flex;
    align-items: center;
    justify-content: flex-start;
    gap: 12px;
    margin-bottom: 16px;
    flex-wrap: wrap;
}

.card-title {
    font-size: 18px;
    font-weight: 700;
    color: #3f3a36;
}

.status-badge {
    padding: 6px 12px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 600;
    background: #f5f1ec;
    color: #7a6f66;
}

.status-waiting-payment {
    background: #fff4df;
    color: #a56a00;
}

.status-paid {
    background: #e8f3ff;
    color: #2f65a8;
}

.status-confirmed {
    background: #e7f5ea;
    color: #2f7a43;
}

.status-canceled {
    background: #fdeaea;
    color: #b04747;
}

.status-completed {
    background: #e9eefc;
    color: #415da8;
}

.info-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 10px 36px;
}

.info-item {
    font-size: 14px;
    color: #555;
}

.info-item strong {
    display: inline-block;
    min-width: 70px;
    color: #7a6f66;
}

.memo {
    margin-top: 16px;
    padding: 14px 16px;
    border-radius: 14px;
    background: #f8f6f3;
    color: #666;
    font-size: 14px;
    line-height: 1.7;
}

.card-actions {
    margin-top: 20px;
    text-align: right;
}

.btn-wrap {
    margin-top: 28px;
    text-align: center;
}

.btn {
    display: inline-block;
    padding: 12px 24px;
    border-radius: 30px;
    font-weight: 600;
    font-size: 15px;
    border: none;
    cursor: pointer;
}

.btn-main {
    background: #a38b7b;
    color: white;
}

.btn-main:hover {
    background: #8f7868;
}

.btn-cancel {
    background: #fdeaea;
    color: #b04747;
}

.btn-cancel:hover {
    opacity: 0.9;
}

footer {
    background: #2f2f2f;
    color: #ddd;
    text-align: center;
    padding: 25px;
    font-size: 14px;
}

@media (max-width: 768px) {
    .header-inner {
        flex-direction: column;
        justify-content: center;
        gap: 10px;
        height: auto;
        padding: 16px 0;
    }

    nav ul {
        gap: 16px;
        flex-wrap: wrap;
        justify-content: center;
    }

    .page-hero {
        padding: 46px 0 26px;
    }

    .page-hero h1 {
        font-size: 32px;
    }

    .reservation-card {
        padding: 20px 18px;
    }

    .reservation-list {
        gap: 14px;
    }

    .card-actions {
        text-align: left;
    }

    .memo {
        margin-top: 12px;
        padding: 14px;
    }
}

@media (max-width: 520px) {
    .info-grid {
        grid-template-columns: 1fr;
        gap: 8px;
    }
}

.admin-dropdown {
    position: relative;
}

.admin-dropdown-toggle {
    cursor: pointer;
}

.admin-dropdown-menu {
    display: none;
    position: absolute;
    top: 100%;
    left: 50%;
    transform: translateX(-50%);
    min-width: 160px;
    padding: 10px 0;
    background: white;
    border: 1px solid #ece7e1;
    border-radius: 14px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
    list-style: none;
    z-index: 100;
}

.admin-dropdown:hover .admin-dropdown-menu {
    display: block;
}

.admin-dropdown-menu li {
    width: 100%;
}

.admin-dropdown-menu a {
    display: block;
    padding: 10px 16px;
    font-size: 13px;
    color: #666;
    white-space: nowrap;
}

.admin-dropdown-menu a:hover,
.admin-dropdown-menu a.active {
    background: #f8f6f3;
    color: #a38b7b;
    font-weight: 600;
}

.pagination-wrap {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin-top: 30px;
    flex-wrap: wrap;
}

.page-btn {
    min-width: 38px;
    height: 38px;
    border: 1px solid #d6d0c9;
    border-radius: 999px;
    background: white;
    cursor: pointer;
}

.page-btn.active {
    background: #a38b7b;
    color: white;
    border-color: #a38b7b;
}
</style>
</head>

<body>

<header>
    <div class="container header-inner">
        <div class="logo"><a href="/index.html">Ro:en Beauty</a></div>

        <nav>
            <ul>
                <li><a href="/index.html">메인</a></li>
                <li><a href="/services.html">시술 메뉴</a></li>
                <li><a href="/gallery.html">갤러리</a></li>
                <li><a href="/reservation.html">예약하기</a></li>

                <li class="my-menu" style="display:none;">
                    <a href="/my-reservations.html" class="active">내 예약</a>
                </li>

                <li class="admin-menu admin-dropdown" style="display:none;">
                    <a href="#" class="admin-dropdown-toggle">관리자 메뉴 ▾</a>

                    <ul class="admin-dropdown-menu">
                        <li><a href="/admin-reservations.html">예약 관리</a></li>
                        <li><a href="/admin-menu-settings.html">메뉴 관리</a></li>
                        <li><a href="/admin-gallery.html">갤러리 관리</a></li>
                        <li><a href="/admin-blocked-times.html">영업 시간 관리</a></li>
                        <li><a href="/admin-settings.html">운영 설정</a></li>
                    </ul>
                </li>
            </ul>
        </nav>

        <div class="auth-box">
            <a href="/login.html" id="loginBtn" class="auth-btn">로그인</a>
            <a href="/signup.html" id="signupBtn" class="auth-btn">회원가입</a>
            <a href="#" id="logoutBtn" class="auth-btn" style="display:none;">로그아웃</a>
        </div>
    </div>
</header>

<div class="page-hero">
    <div class="container">
        <h1>내 예약</h1>
        <p>신청하신 예약 내역과 진행 상태를 확인할 수 있습니다.</p>
    </div>
</div>

<section class="reservation-section">
    <div class="container">
        <div id="reservationList" class="reservation-list"></div>

        <div id="pagination" class="pagination-wrap"></div>

        <div class="btn-wrap">
            <a href="/reservation.html" class="btn btn-main">새 예약하기</a>
        </div>
    </div>
</section>

<footer>
    © 2026 Ro:en Beauty
</footer>

<script src="https://js.tosspayments.com/v2/standard"></script>

<script>
const TOSS_CLIENT_KEY = "test_ck_ALnQvDd2VJG4WWjqZnabrMj7X41m";

let currentPage = 0;
const pageSize = 5;

document.addEventListener("DOMContentLoaded", async function () {
    const user = JSON.parse(localStorage.getItem("user"));

    const loginBtn = document.getElementById("loginBtn");
    const signupBtn = document.getElementById("signupBtn");
    const logoutBtn = document.getElementById("logoutBtn");

    if (!user) {
        alert("로그인 후 내 예약을 확인할 수 있습니다.");
        location.href = "/login.html";
        return;
    }

    loginBtn.style.display = "none";
    signupBtn.style.display = "none";
    logoutBtn.style.display = "inline-block";

    document.querySelectorAll(".my-menu")
        .forEach(menu => menu.style.display = "block");

    if (user.role === "ADMIN" || user.role === "OWNER") {
        document.querySelectorAll(".admin-menu")
            .forEach(menu => menu.style.display = "block");
    }

    logoutBtn.addEventListener("click", function (e) {
        e.preventDefault();

        localStorage.removeItem("user");
        localStorage.removeItem("accessToken");
        
        location.href = "/index.html";
    });

    await loadMyReservations();
});

async function loadMyReservations() {
    const list = document.getElementById("reservationList");

    try {
        const res = await fetch(
            `/api/reservations/my?page=${currentPage}&size=${pageSize}`,
            {
                headers: {
                    "Authorization":
                        "Bearer " + localStorage.getItem("accessToken")
                }
            }
        );

        if (!res.ok) {
            const errorText = await res.text();
            console.error(errorText);
            alert("예약 조회 실패");
            return;
        }

        const pageData = await res.json();

        if (
            pageData.totalPages > 0 &&
            currentPage >= pageData.totalPages
        ) {
            currentPage = pageData.totalPages - 1;
            return loadMyReservations();
        }

        const reservations = pageData.content;

        if (reservations.length === 0) {
            list.innerHTML = `
                <div class="empty-box">
                    아직 예약 내역이 없습니다.<br>
                    원하시는 시술을 선택해 예약을 신청해보세요.
                </div>
            `;
            return;
        }

        renderPagination(pageData);

        list.innerHTML = "";

        reservations.forEach(r => {
            const card = document.createElement("div");
            card.className = "reservation-card";

            card.innerHTML = `
                <div class="card-header">
                    <div class="card-title">${r.serviceName}</div>
                    ${getStatusBadge(r.status)}
                </div>

                <div class="info-grid">
                    <div class="info-item"><strong>예약자</strong> ${r.name}</div>
                    <div class="info-item"><strong>연락처</strong> ${formatPhone(r.phone)}</div>
                    <div class="info-item"><strong>날짜</strong> ${r.reservationDate}</div>
                    <div class="info-item"><strong>시간</strong> ${formatTime(r.reservationTime)}</div>
                    <div class="info-item"><strong>소요시간</strong> ${r.durationMinutes}분</div>
                </div>

                <div class="memo">
                    <strong>요청사항</strong><br>
                    ${r.requestMemo || "작성된 요청사항이 없습니다."}
                </div>

                ${renderActionButton(r)}
            `;

            list.appendChild(card);
        });

    } catch (error) {
        console.error(error);
        alert("예약 조회 중 오류가 발생했습니다.");
    }
}

function renderActionButton(reservation) {

    if (reservation.status === "WAITING_PAYMENT") {
        return `
            <div class="card-actions">
                <button
                    class="btn btn-main"
                    onclick="continuePayment(${reservation.id})">
                    결제 이어하기
                </button>

                <button
                    class="btn btn-cancel"
                    onclick="cancelReservation(${reservation.id}, '${reservation.status}')">
                    예약 취소
                </button>
            </div>
        `;
    }

    if (
        reservation.status === "PAID" ||
        reservation.status === "CONFIRMED"
    ) {
        return `
            <div class="card-actions">
                <button
                    class="btn btn-cancel"
                    onclick="cancelReservation(${reservation.id}, '${reservation.status}')">
                    예약 취소
                </button>
            </div>
        `;
    }

    return "";
}

async function continuePayment(reservationId) {

    try {
        const response = await fetch(
            `/api/reservations/${reservationId}/payments/checkout`,
            {
                headers: {
                    "Authorization":
                        "Bearer " + localStorage.getItem("accessToken")
                }
            }
        );

        if (!response.ok) {
            const errorText = await response.text();
            throw new Error(errorText);
        }

        const checkout = await response.json();

        const user = JSON.parse(localStorage.getItem("user"));

        const tossPayments = TossPayments(TOSS_CLIENT_KEY);

        const payment = tossPayments.payment({
            customerKey: "USER_" + user.userId
        });

        await payment.requestPayment({
            method: "CARD",

            amount: {
                currency: "KRW",
                value: checkout.amount
            },

            orderId: checkout.orderId,
            orderName: checkout.orderName,

            customerName: checkout.customerName,
            customerEmail: checkout.customerEmail,

            successUrl:
                `${window.location.origin}/payment-success.html?reservationId=${reservationId}`,

            failUrl:
                `${window.location.origin}/payment-fail.html?reservationId=${reservationId}`
        });

    } catch (error) {

        console.error(error);

        alert(
            error.message ||
            "결제를 이어서 진행할 수 없습니다."
        );
    }
}

async function cancelReservation(id, status) {
    const isWaitingPayment = status === "WAITING_PAYMENT";

    let reason = "";

    if (isWaitingPayment) {
        if (!confirm("결제 대기 중인 예약을 취소하시겠습니까?")) {
            return;
        }

        reason = "결제 전 고객 취소";
    } else {
        reason = prompt("취소 사유를 입력해주세요.");

        if (reason === null) {
            return;
        }
    }

    try {
        const response = isWaitingPayment
            ? await fetch(`/api/reservations/${id}/cancel`, {
                method: "PATCH",
                headers: {
                    "Content-Type": "application/json",
                    "Authorization":
                        "Bearer " + localStorage.getItem("accessToken")
                }
            })
            : await fetch(`/api/reservations/${id}/payments/cancel`, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "Authorization":
                        "Bearer " + localStorage.getItem("accessToken")
                },
                body: JSON.stringify({
                    cancelReason: reason,
                    canceledBy: "CUSTOMER"
                })
            });

        if (!response.ok) {
            const errorText = await response.text();
            throw new Error(errorText || "예약 취소 실패");
        }

        alert(isWaitingPayment
            ? "예약이 취소되었습니다."
            : "예약 및 결제가 취소되었습니다.");

        await loadMyReservations();

    } catch (error) {
        console.error(error);
        alert(error.message || "예약 취소 중 오류가 발생했습니다.");
    }
}

function getStatusText(status) {
    switch (status) {
        case "WAITING_PAYMENT":
            return "결제 대기";
        case "PAID":
            return "결제 완료";
        case "CONFIRMED":
            return "예약 확정";
        case "COMPLETED":
            return "시술 완료";
        case "CANCELED":
            return "예약 취소";
        default:
            return status;
    }
}

function getStatusBadge(status) {
    switch (status) {
        case "WAITING_PAYMENT":
            return `<div class="status-badge status-waiting-payment">결제 대기</div>`;
        case "PAID":
            return `<div class="status-badge status-paid">결제 완료</div>`;
        case "CONFIRMED":
            return `<div class="status-badge status-confirmed">예약 확정</div>`;
        case "COMPLETED":
            return `<div class="status-badge status-completed">시술 완료</div>`;
        case "CANCELED":
            return `<div class="status-badge status-canceled">예약 취소</div>`;
        default:
            return `<div class="status-badge">${status}</div>`;
    }
}

function formatTime(time) {
    if (!time) return "";
    return time.substring(0, 5);
}

function formatPhone(phone) {
    if (!phone) return "-";

    const onlyNumber = phone.replace(/\D/g, "");

    if (onlyNumber.length === 11) {
        return onlyNumber.replace(/(\d{3})(\d{4})(\d{4})/, "$1-$2-$3");
    }

    if (onlyNumber.length === 10) {
        return onlyNumber.replace(/(\d{3})(\d{3})(\d{4})/, "$1-$2-$3");
    }

    return phone;
}

function renderPagination(pageData) {

    const pagination =
        document.getElementById("pagination");

    pagination.innerHTML = "";

    if (!pageData || pageData.totalPages <= 1) {
        return;
    }

    const prevBtn = document.createElement("button");
    prevBtn.className = "page-btn";
    prevBtn.textContent = "이전";
    prevBtn.disabled = pageData.first;

    prevBtn.onclick = function () {
        currentPage--;
        loadMyReservations();
    };

    pagination.appendChild(prevBtn);

    for (let i = 0; i < pageData.totalPages; i++) {

        const btn = document.createElement("button");

        btn.className =
            "page-btn" +
            (i === pageData.number ? " active" : "");

        btn.textContent = i + 1;

        btn.onclick = function () {
            currentPage = i;
            loadMyReservations();
        };

        pagination.appendChild(btn);
    }

    const nextBtn = document.createElement("button");

    nextBtn.className = "page-btn";
    nextBtn.textContent = "다음";
    nextBtn.disabled = pageData.last;

    nextBtn.onclick = function () {
        currentPage++;
        loadMyReservations();
    };

    pagination.appendChild(nextBtn);
}
</script>
</body>
</html>
