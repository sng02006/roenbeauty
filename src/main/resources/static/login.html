<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>로그인</title>

<style>
body {
    background: #f8f6f3;
    font-family: Arial, sans-serif;
}

.auth-container {
    width: 400px;
    margin: 100px auto;
    padding: 40px;
    background: #fffaf5;
    border-radius: 12px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    text-align: center;
}

.auth-container h2 {
    margin-bottom: 30px;
    color: #333;
}

.auth-container input {
    width: 100%;
    padding: 12px;
    margin-bottom: 15px;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 14px;
}

.auth-container input:focus {
    outline: none;
    border-color: #d4b996;
}

.auth-btn {
    width: 100%;
    padding: 12px;
    background: #d4b996;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 15px;
    cursor: pointer;
}

.auth-btn:hover {
    background: #c3a57e;
}

.auth-link {
    margin-top: 15px;
    font-size: 13px;
}

.auth-link a {
    color: #a68b6d;
    text-decoration: none;
}

.kakao-btn {
    margin-top: 12px;
    background: #FEE500;
    color: #191919;
    border: none;
}
</style>
</head>

<body>

<div class="auth-container">
    <h2>로그인</h2>

    <form id="loginForm">
        <input type="email" id="email" placeholder="이메일" required>
        <input type="password" id="password" placeholder="비밀번호" required>

        <button type="submit" class="auth-btn">로그인</button>
        <button type="button" class="auth-btn kakao-btn" onclick="startKakaoLogin()">
            카카오로 로그인
        </button>
    </form>

    <div class="auth-link">
        계정이 없으신가요? <a href="signup.html">회원가입</a>
    </div>
</div>

<script>
document.getElementById("loginForm").addEventListener("submit", async function(e) {
    e.preventDefault();

    const data = {
        email: document.getElementById("email").value,
        password: document.getElementById("password").value
    };

    try {
        const res = await fetch("/api/users/login", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify(data)
        });

        if (!res.ok) {
            alert("로그인 실패");
            return;
        }

        const result = await res.json();

        // 유저 정보 저장
        localStorage.setItem("accessToken", result.accessToken);
        localStorage.setItem("user", JSON.stringify({
            userId: result.userId,
            email: result.email,
            name: result.name,
            phone: result.phone,
            role: result.role
        }));
        alert("로그인 성공!");
        location.href = "/index.html";

    } catch (error) {
        console.error(error);
        alert("서버 오류 발생");
    }
});

function startKakaoLogin() {
    const clientId = "25cb803ebf43d02fe13762e1af22bec0";
    const redirectUri = window.location.origin + "/kakao-callback.html";

    const kakaoAuthUrl =
        "https://kauth.kakao.com/oauth/authorize"
        + "?response_type=code"
        + "&client_id=" + clientId
        + "&redirect_uri=" + encodeURIComponent(redirectUri)
        + "&scope=profile_nickname";

    location.href = kakaoAuthUrl;
}
</script>

</body>
</html>
