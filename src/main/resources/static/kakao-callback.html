<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>카카오 로그인 처리 중 | Ro:en Beauty</title>
</head>
<body>
<p>카카오 로그인을 처리하고 있습니다...</p>

<script>
(async function () {
    const params = new URLSearchParams(window.location.search);
    const code = params.get("code");

    if (!code) {
        alert("카카오 로그인 인증 코드가 없습니다.");
        location.href = "/login.html";
        return;
    }

    try {
        const response = await fetch("/api/users/kakao/login", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                code: code,
                redirectUri: window.location.origin + "/kakao-callback.html"
            })
        });

        if (!response.ok) {
            const errorText = await response.text();
            throw new Error(errorText || "카카오 로그인 실패");
        }

        const result = await response.json();

        localStorage.setItem("accessToken", result.accessToken);
        localStorage.setItem("user", JSON.stringify({
            userId: result.userId,
            email: result.email,
            name: result.name,
            phone: result.phone,
            role: result.role
        }));

        alert("카카오 로그인 성공!");
        location.href = "/index.html";
    } catch (error) {
        console.error(error);
        alert(error.message || "카카오 로그인 처리 중 오류가 발생했습니다.");
        location.href = "/login.html";
    }
})();
</script>
</body>
</html>
